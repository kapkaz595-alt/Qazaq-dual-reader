<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2c7a58">
<title>托特文转换</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: single narrow column. Direction controls on top, input card, result card. */
:root {
  --bg: #f1f6f3;
  --surface: #ffffff;
  --surface-2: #f6faf8;
  --ink: #14281f;
  --ink-2: #5a7166;
  --line: #d3e3d9;
  --accent: #2c7a58;
  --accent-ink: #ffffff;
  --accent-soft: #dff0e7;
  --focus: #1c5a3f;
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-ar: "Noto Naskh Arabic", "Amiri", "Scheherazade New", "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1813; --surface: #15231c; --surface-2: #1a2b22; --ink: #e5f0e9; --ink-2: #93aa9d;
    --line: #27392f; --accent: #5bbd8d; --accent-ink: #0b1a12; --accent-soft: #1f3a2d; --focus: #8fdcb4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1813; --surface: #15231c; --surface-2: #1a2b22; --ink: #e5f0e9; --ink-2: #93aa9d;
  --line: #27392f; --accent: #5bbd8d; --accent-ink: #0b1a12; --accent-soft: #1f3a2d; --focus: #8fdcb4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 0 14px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

header { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.langbtn { margin-left: auto; min-height: 38px; padding: 0 14px; font-weight: 700; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
header .mark { width: 30px; height: 30px; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.dirs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.dir { min-height: 52px; font-size: 17px; font-weight: 600; direction: ltr; }
.dir .ar { font-size: 20px; }
.dir[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swap { width: 52px; padding: 0; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }
.sw { justify-content: flex-start; gap: 12px; font-weight: 600; }
.track { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.sw[aria-checked="true"] .track { background: var(--accent); }
.sw[aria-checked="true"] .track::after { transform: translateX(18px); }
.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 16px; }

.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 700; }
.count { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; font-variant-numeric: tabular-nums; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools .soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
textarea {
  width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2);
  color: var(--ink); font: inherit; font-size: 17px; line-height: 1.7; padding: 12px 14px;
}
textarea.ar { font-family: var(--font-ar); font-size: 22px; line-height: 2; }
textarea::placeholder { color: var(--ink-2); opacity: .75; font-family: var(--font-ui); font-size: 15px; }
.bar { display: grid; grid-template-columns: 46px 46px 1fr; gap: 8px; }
.bar button { padding: 0; }
.bar .ex { padding: 0 14px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>html{color-scheme:light dark}body{margin:0}</style>
</head>
<body>
<main class="app">
  <header>
    <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 5v22M6.5 10.5l19 11M25.5 10.5l-19 11"/></svg>
    <h1 data-t="title">托特文转换</h1>
    <button id="lang" class="langbtn" type="button" aria-label="Language">ҚАЗ</button>
  </header>

  <section class="panel" aria-label="转换方向">
    <div class="dirs">
      <button class="dir" id="dirC2T" type="button" aria-pressed="true"><span>Қа</span><span>→</span><span class="ar">قا</span></button>
      <button class="swap" id="swap" type="button" aria-label="交换方向"><svg class="i" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
      <button class="dir" id="dirT2C" type="button" aria-pressed="false"><span class="ar">قا</span><span>→</span><span>Қа</span></button>
    </div>
    <div class="row2">
      <button class="sw" id="live" type="button" role="switch" aria-checked="true"><span class="track"></span><span data-t="live">实时转换</span></button>
      <button class="go" id="go" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 20L16 8M14 6l4 4M18 3v3M16.5 4.5h3M6 5v2M5 6h2M20 14v2M19 15h2"/></svg><span data-t="go">开始转换</span></button>
    </div>
  </section>

  <section class="panel" aria-label="输入">
    <div class="card-h"><h2 id="inTitle">输入西里尔文</h2><span class="count" id="inCount">0 字符</span></div>
    <div class="tools">
      <button class="soft" id="paste" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg><span data-t="paste">粘贴文本</span></button>
      <button id="clear" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="clear">清空</span></button>
    </div>
    <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="在此处粘贴哈萨克西里尔文…"></textarea>
    <div class="bar">
      <button id="undo" type="button" aria-label="撤销"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redo" type="button" aria-label="重做"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button class="ex" id="example" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span data-t="example">使用示例</span></button>
    </div>
  </section>

  <section class="panel" aria-label="结果">
    <div class="card-h"><h2 id="outTitle">转换后托特文</h2><span class="count" id="outCount">0 字符</span></div>
    <textarea id="output" class="ar" dir="rtl" readonly spellcheck="false" placeholder="转换结果将显示在这里"></textarea>
    <div class="tools">
      <button class="soft" id="copy" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg><span data-t="copy">复制结果</span></button>
      <button id="toInput" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span data-t="back">结果放回输入</span></button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---- conversion logic ---- */
var HAMZA = "ٴ";
var C2T = {
  "а":"ا","ә":"ا","б":"ب","в":"ۆ","г":"گ","ғ":"ع","д":"د","е":"ە","ё":"يو","ж":"ج","з":"ز","и":"ي","й":"ي",
  "к":"ك","қ":"ق","л":"ل","м":"م","н":"ن","ң":"ڭ","о":"و","ө":"و","п":"پ","р":"ر","с":"س","т":"ت","у":"ۋ",
  "ұ":"ۇ","ү":"ۇ","ф":"ف","х":"ح","һ":"ھ","ц":"تس","ч":"چ","ш":"ش","щ":"شش","ы":"ى","і":"ى","э":"ە",
  "ю":"يۋ","я":"يا","ъ":"","ь":""
};
var FRONT = "әөүі";
var P_C2T = { ",":"،", ";":"؛", "?":"؟" };
var P_T2C = { "،":",", "؛":";", "؟":"?" };

var LAT = {"a":"а","c":"с","e":"е","o":"о","p":"р","x":"х","y":"у","k":"к","m":"м","t":"т","i":"і","h":"һ",
  "\u0259":"ә","\u01DD":"ә","\u0275":"ө","\u019F":"ө","\u0398":"ө","\u03B8":"ө","\u0131":"і"};
var NONJOIN = "ادذرزوۆۇۋەءٴ";
function fixLatin(w) {
  var s = w.toLowerCase(), out = "", i, ch;
  if (!/[\u0400-\u04FF]/.test(s)) {
    for (i = 0; i < s.length; i++) if (LAT[s.charAt(i)] === undefined) return w;
  }
  for (i = 0; i < s.length; i++) { ch = s.charAt(i); out += (LAT[ch] !== undefined ? LAT[ch] : ch); }
  return out;
}
function dotless(t) {
  var r = "", i, nx;
  for (i = 0; i < t.length; i++) {
    nx = t.charAt(i + 1);
    r += (t.charAt(i) === "ى" && /[\u0622-\u064A\u066E\u0679-\u06D5]/.test(nx)) ? "\u066E" : t.charAt(i);
  }
  return r;
}
function cyrWord(w) {
  var s = fixLatin(w).toLowerCase(), out = "", front = false, i, ch;
  for (i = 0; i < s.length; i++) {
    ch = s.charAt(i);
    if (FRONT.indexOf(ch) > -1) front = true;
    out += (C2T[ch] !== undefined ? C2T[ch] : ch);
  }
  return ((front && !/[ەكگ]/.test(out)) ? HAMZA : "") + dotless(out);
}
function cyrToTote(text) {
  return text.replace(/([A-Za-z\u0259\u01DD\u0275\u019F\u0131\u0398\u03B8\u0400-\u04FF]+)|([,;?])/g, function (m, w, p) {
    if (!w) return P_C2T[p];
    var f = fixLatin(w);
    return (f === w && !/[\u0400-\u04FF]/.test(w)) ? w : cyrWord(w);
  });
}

var T2C = {
  "ب":"б","ۆ":"в","گ":"г","غ":"ғ","ع":"ғ","أ":"ә","ؤ":"ө","ئ":"і","ٵ":"ә","ٶ":"ө","ٷ":"ү","ٸ":"і","د":"д","ە":"е","ج":"ж","ز":"з","ك":"к","ق":"қ","ل":"л","م":"м","ن":"н",
  "ڭ":"ң","پ":"п","ر":"р","س":"с","ت":"т","ۋ":"у","ف":"ф","ح":"х","ھ":"һ","چ":"ч","ش":"ш"
};
var PAIRS = { "تس":"ц", "شش":"щ", "يا":"я", "يۋ":"ю", "يو":"ё" };
var CYR_VOWELS = "аәоөұүеыіу";
var AR_VOWELS = "اوۇەى";

function toteWord(w) {
  var s = w.split(HAMZA).join(""), hz = w.indexOf(HAMZA) > -1 || /[ەكگ]/.test(s), out = "", i = 0, ch, two, last, nxt;
  while (i < s.length) {
    two = s.substr(i, 2);
    if (two === "\u06C7\u0654") { out += "ү"; i += 2; continue; }
    if (PAIRS[two]) { out += PAIRS[two]; i += 2; continue; }
    ch = s.charAt(i);
    if (ch === "ا") out += hz ? "ә" : "а";
    else if (ch === "و") out += hz ? "ө" : "о";
    else if (ch === "ۇ") out += hz ? "ү" : "ұ";
    else if (ch === "ى" || ch === "\u066E" || ch === "ی") out += hz ? "і" : "ы";
    else if (ch === "ي") {
      last = out.charAt(out.length - 1);
      out += (last && CYR_VOWELS.indexOf(last) > -1) ? "й" : "и";
    }
    else out += (ch === "ک" ? "к" : (T2C[ch] !== undefined ? T2C[ch] : ch));
    i++;
  }
  return out;
}
function toteToCyr(text) {
  return text.replace(/([ء-ئٮٴ-ە]+)|([،؛؟])/g, function (m, w, p) { return w ? toteWord(w) : P_T2C[p]; });
}
</script>

<script>
/* ---- language ---- */
var I18N = {
  zh: { title:"托特文转换", live:"实时转换", go:"开始转换", paste:"粘贴文本", clear:"清空", example:"使用示例", copy:"复制结果", back:"结果放回输入",
    inC:"输入西里尔文", inT:"输入托特文", outT:"转换后托特文", outC:"转换后西里尔文", chars:"字符",
    phC:"在此处粘贴哈萨克西里尔文…", phT:"在此处粘贴托特文（阿拉伯字母哈萨克文）…", phOut:"转换结果将显示在这里",
    tPaste:"请长按输入框，选择“粘贴”", tNone:"还没有结果", tCopied:"已复制", tManual:"请手动长按复制", btn:"ҚАЗ" },
  kk: { title:"Төте жазу түрлендіргіші", live:"Баспа бас", go:"Аиналдыру", paste:"Қою", clear:"Тазалау", example:"Мысал", copy:"Көшіру", back:"Нәтижені енгізуге салу",
    inC:"Кириллицаны енгізіңіз", inT:"Төте жазуды енгізіңіз", outT:"Төте жазу нәтижесі", outC:"Кириллица нәтижесі", chars:"таңба",
    phC:"Қазақ кириллицасын осында қойыңыз…", phT:"Төте жазуды осында қойыңыз…", phOut:"Нәтиже осында көрсетіледі",
    tPaste:"Енгізу жолын басып тұрып, «Қою» таңдаңыз", tNone:"Нәтиже әлі жоқ", tCopied:"Көшірілді", tManual:"Қолмен көшіріңіз", btn:"中文" }
};
var LANG = "zh";
try { LANG = localStorage.getItem("tote-lang") || ((navigator.language || "").toLowerCase().indexOf("kk") === 0 ? "kk" : "zh"); } catch (e) {}
if (!I18N[LANG]) LANG = "zh";
function T(k) { return I18N[LANG][k]; }
</script>

<script>
/* ---- interface ---- */
(function () {
  var SAMPLE = "Сәлем, достар! Қазақстан — менің Отаным. Бүгін ауа райы өте жақсы.";
  var $ = function (id) { return document.getElementById(id); };
  var input = $("input"), output = $("output");
  var dir = "c2t", live = true;
  var hist = [""], hi = 0, timer = null;

  function convert() {
    var v = input.value;
    output.value = dir === "c2t" ? cyrToTote(v) : toteToCyr(v);
    $("inCount").textContent = v.length + " " + T("chars");
    $("outCount").textContent = output.value.length + " " + T("chars");
  }
  function setDir(d) {
    dir = d;
    var c = d === "c2t";
    $("dirC2T").setAttribute("aria-pressed", c);
    $("dirT2C").setAttribute("aria-pressed", !c);
    $("inTitle").textContent = c ? T("inC") : T("inT");
    $("outTitle").textContent = c ? T("outT") : T("outC");
    input.placeholder = c ? T("phC") : T("phT");
    output.placeholder = T("phOut");
    input.classList.toggle("ar", !c); input.dir = c ? "ltr" : "rtl";
    output.classList.toggle("ar", c); output.dir = c ? "rtl" : "ltr";
    convert();
  }
  function record(v) {
    if (v === hist[hi]) return;
    hist = hist.slice(0, hi + 1); hist.push(v);
    if (hist.length > 100) hist.shift();
    hi = hist.length - 1; buttons();
  }
  function flush() { if (timer) { clearTimeout(timer); timer = null; record(input.value); } }
  function setText(v) { flush(); input.value = v; record(v); convert(); }
  function buttons() { $("undo").disabled = hi <= 0; $("redo").disabled = hi >= hist.length - 1; }
  var tt;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 1800); }

  input.addEventListener("input", function () {
    if (live) convert(); else { $("inCount").textContent = input.value.length + " " + T("chars"); }
    clearTimeout(timer); timer = setTimeout(function () { timer = null; record(input.value); }, 400);
  });
  $("go").onclick = convert;
  $("live").onclick = function () {
    live = !live; this.setAttribute("aria-checked", live); if (live) convert();
  };
  $("dirC2T").onclick = function () { if (dir !== "c2t") { setDir("c2t"); } };
  $("dirT2C").onclick = function () { if (dir !== "t2c") { setDir("t2c"); } };
  $("swap").onclick = function () {
    var res = output.value; setDir(dir === "c2t" ? "t2c" : "c2t"); setText(res);
  };
  $("toInput").onclick = function () {
    var res = output.value; if (!res) return;
    setDir(dir === "c2t" ? "t2c" : "c2t"); setText(res);
  };
  $("clear").onclick = function () { setText(""); input.focus(); };
  $("example").onclick = function () { setText(dir === "c2t" ? SAMPLE : cyrToTote(SAMPLE)); };
  $("undo").onclick = function () { flush(); if (hi > 0) { hi--; input.value = hist[hi]; convert(); buttons(); } };
  $("redo").onclick = function () { flush(); if (hi < hist.length - 1) { hi++; input.value = hist[hi]; convert(); buttons(); } };
  $("paste").onclick = function () {
    var fail = function () { input.focus(); toast(T("tPaste")); };
    try { navigator.clipboard.readText().then(function (t) { if (t) setText(t); else fail(); }, fail); } catch (e) { fail(); }
  };
  $("copy").onclick = function () {
    var v = output.value; if (!v) { toast(T("tNone")); return; }
    var done = function () { toast(T("tCopied")); };
    var fallback = function () { output.focus(); output.select(); try { document.execCommand("copy") ? done() : toast(T("tManual")); } catch (e) { toast(T("tManual")); } };
    try { navigator.clipboard.writeText(v).then(done, fallback); } catch (e) { fallback(); }
  };

  function applyLang() {
    document.documentElement.lang = LANG === "kk" ? "kk" : "zh";
    document.title = T("title");
    var els = document.querySelectorAll("[data-t]"), i;
    for (i = 0; i < els.length; i++) els[i].textContent = T(els[i].getAttribute("data-t"));
    $("lang").textContent = T("btn");
    setDir(dir);
  }
  $("lang").onclick = function () {
    LANG = LANG === "zh" ? "kk" : "zh";
    try { localStorage.setItem("tote-lang", LANG); } catch (e) {}
    applyLang();
  };
  applyLang(); buttons();
})();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
